# =============================================================================
#  hugo.toml — THE single place to configure your site.
#  Almost everything you'll want to change lives here or in the [params] block.
#  After editing, the local preview reloads automatically.
# =============================================================================

# Your live URL. For a GitHub *user* page the repo is named "<user>.github.io"
# and the site lives at the root, so this is correct as-is.
# If you use a custom domain, change this to e.g. "https://yourdomain.com/".
baseURL = "https://0xausty.github.io/"

locale       = "en-us"      # used for RSS/schema; replaces the old languageCode key
title        = "0xAusty // Security Portfolio"

# Leave false. Hugo already emits pretty URLs (/writeups/my-box/) by default —
# that is controlled by `uglyURLs`, not this key. Setting it true would rewrite
# every relative URL in the output to an absolute one.
canonifyURLs = false

# Build a little faster / cleaner.
# NOTE: these are root-level keys, so they MUST stay ABOVE the first [table]
# header below. In TOML, any key after a [table] belongs to that table — put
# these under [pagination] and they are silently ignored.
enableRobotsTXT = true
enableGitInfo   = false          # set true if you want "last modified from git"
summaryLength   = 30

# How many items show in list pages / RSS before paginating.
[pagination]
  pagerSize = 10

# -----------------------------------------------------------------------------
#  Taxonomies — how recruiters browse your content.
#  Left side = singular (used in front matter), right side = plural (URL + page).
# -----------------------------------------------------------------------------
[taxonomies]
  platform   = "platforms"     # writeups: Hack The Box, TryHackMe … / detections: Windows, Splunk …
  os         = "oses"          # Linux, Windows  (Active Directory now lives in `tags`)
  difficulty = "difficulties"  # Easy, Medium, Hard, Insane
  tool       = "tools"         # nmap, burp, ffuf ...
  tag        = "tags"          # privilege-escalation, bof, sqli, active-directory ...

  # --- Detections section ---
  mitre-technique = "mitre-techniques"  # T1059.001, T1547.001 ...
  log-source      = "log-sources"       # Sysmon, Windows Security, Zeek, CloudTrail ...

  # --- Portfolio grouping ---
  # The /portfolio/ page groups work by this instead of by date. Any page in any
  # section can opt in with e.g.  skills = ["Active Directory", "Detection Engineering"]
  skill = "skills"

# -----------------------------------------------------------------------------
#  Output formats — adds a JSON search index at /index.json for full-text search.
# -----------------------------------------------------------------------------
[outputs]
  home = ["HTML", "RSS", "JSON", "robots"]

# -----------------------------------------------------------------------------
#  Markdown rendering.
# -----------------------------------------------------------------------------
[markup]
  [markup.tableOfContents]
    startLevel = 2     # TOC starts at ## headings
    endLevel   = 4
    ordered    = false
  [markup.highlight]
    noClasses      = false   # use CSS classes so dark/light themes can recolor code
    lineNos        = false   # keep line numbers off so "copy" copies clean commands
    tabWidth       = 4
    codeFences     = true
    guessSyntax    = true
  [markup.goldmark.renderer]
    unsafe = true            # allow raw HTML in markdown (needed for some embeds)

# =============================================================================
#  [params] — YOUR personal details & site behaviour.
#  ↓↓↓  This is the block you'll edit most often.  ↓↓↓
# =============================================================================
[params]
  # ---- Identity ----------------------------------------------------------
  author   = "0xAusty"
  tagline  = "Cybersecurity specialist"
  # One-line bio for the homepage hero:
  heroBio  = "Four years in security, seven in enterprise IT. At work I own security baselines built on CIS Benchmarks and NIST SP 800-53. On my own time I play CTFs and write up how each challenge was solved, most recently Huntress CTF 2026."
  # Longer bio (also used on the About page intro & meta description):
  bio      = "Cybersecurity specialist: security baselines at work, CTFs and challenge write-ups on my own time."

  # ---- Contact / social links --------------------------------------------
  # Leave a value empty ("") to hide that link everywhere.
  email    = "0xausty@proton.me"
  github   = "https://github.com/0xausty"
  linkedin = ""                   # add your real profile URL to show the icon
  twitter  = ""                                          # e.g. https://x.com/handle
  mastodon = ""
  # Put a REAL resume PDF at static/resume.pdf, then set this to "/resume.pdf"
  # to show the "Resume" button on the homepage. Left empty so the site never
  # hands a recruiter a placeholder file.
  resume   = ""

  # ---- Theme / design ----------------------------------------------------
  # The whole palette is defined as design tokens in assets/css/main.scss.
  # This one value sets the single accent colour used across the site.
  accentColor = "#5eead4"          # a confident teal; try "#a78bfa", "#f472b6", "#22d3ee"
  defaultTheme = "dark"            # "dark" or "light" — the site's starting theme

  # ---- SEO / sharing -----------------------------------------------------
  description = "The security portfolio of 0xAusty: the Huntress CTF 2026 write-ups, security tooling and notes."
  keywords    = ["cybersecurity", "ctf", "huntress ctf", "writeups", "detection engineering", "reverse engineering", "infosec"]
  # A 1200x630 image at static/images/og-default.png makes shared links look good.
  ogImage     = "/images/og-default.png"

  # ---- Feature toggles ---------------------------------------------------
  showReadingTime = true
  enableSearch    = true

  # ---- Analytics ---------------------------------------------------------
  # GoatCounter account name: the "0xausty" in 0xausty.goatcounter.com. Empty =
  # no analytics. Only production builds (what CI deploys) load the script, so
  # `hugo server` previews never count as visits.
  goatcounter = "0xausty"

# -----------------------------------------------------------------------------
#  Top navigation. Reorder / add / remove freely. `weight` sets the order.
# -----------------------------------------------------------------------------
[menu]
  [[menu.main]]
    name   = "Portfolio"
    url    = "/portfolio/"
    weight = 5
  [[menu.main]]
    name   = "Huntress CTF"
    url    = "/huntress-ctf-2026/"
    weight = 12
  [[menu.main]]
    name   = "About"
    url    = "/about/"
    weight = 40

# -----------------------------------------------------------------------------
#  RSS: put full content in the feed instead of just summaries.
# -----------------------------------------------------------------------------
[services]
  [services.rss]
    limit = 20
