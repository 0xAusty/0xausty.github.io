{{ define "main" }}
<div class="container">
  <header class="article-header">
    <h1>{{ .Title }}</h1>
    {{ with .Content }}<div class="page-intro">{{ . }}</div>{{ end }}
  </header>

  <div class="search-box">
    <span class="search-icon" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    </span>
    <input type="search" id="search-input" class="search-input" placeholder="Search writeups, detections, projects, notes…" autocomplete="off" aria-label="Search">
  </div>

  <ul id="search-results" class="post-list"></ul>
</div>
{{ end }}

{{ define "scripts" }}
{{ $search := resources.Get "js/search.js" | minify | fingerprint }}
<script src="{{ $search.RelPermalink }}" integrity="{{ $search.Data.Integrity }}" defer></script>
{{ end }}
