<header class="site-header">
  <div class="container">
    <a class="brand" href="{{ "/" | relURL }}"><span class="prompt">$</span> {{ site.Params.author }}</a>

    <button class="icon-btn nav-toggle" aria-label="Toggle navigation" aria-expanded="false" aria-controls="site-nav">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>

    <nav class="nav" id="site-nav" aria-label="Primary">
      {{- $current := . -}}
      {{ range site.Menus.main }}
        <a href="{{ .URL | relURL }}"{{ if $current.IsMenuCurrent "main" . }} class="active" aria-current="page"{{ else if $current.HasMenuCurrent "main" . }} class="active"{{ end }}>{{ .Name }}</a>
      {{ end }}
      {{ if site.Params.enableSearch }}
      <a href="{{ "/search/" | relURL }}" aria-label="Search" class="icon-btn" style="margin-left:.25rem">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
      </a>
      {{ end }}
      <button class="icon-btn theme-toggle" aria-label="Toggle dark / light theme" title="Toggle theme">
        <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
    </nav>
  </div>
</header>
